name: Backend CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (server)
        working-directory: ./server
        run: npm ci

      - name: Run lint/tests (if any)
        working-directory: ./server
        run: |
          echo "No tests configured; add test script to package.json to run tests here."
