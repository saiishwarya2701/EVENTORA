name: Fullstack CI & Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (client)
        working-directory: ./client
        run: |
          npm ci

      - name: Build client
        working-directory: ./client
        run: npm run build

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./client/dist

  deploy-frontend:
    needs: frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    needs: frontend
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_API_KEY && secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for backend validation
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (server)
        working-directory: ./server
        run: npm ci

      - name: Trigger Render deploy
        run: |
          echo "Triggering Render deploy for service $RENDER_SERVICE_ID"
          curl -s -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":true}'

  backend-secrets-check:
    needs: frontend
    runs-on: ubuntu-latest
    if: ${{ !secrets.RENDER_API_KEY || !secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Backend deploy skipped
        run: |
          echo "Render backend deploy was skipped because RENDER_API_KEY or RENDER_SERVICE_ID is not configured."
          echo "Set both repository secrets to deploy backend automatically."
